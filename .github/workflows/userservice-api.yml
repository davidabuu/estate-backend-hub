name: Build and Deploy UserService API

on:
  push:
    branches:
      - main
    paths:
      - 'Services/UserService/**'
      - '.github/workflows/userservice-api.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login to Azure Container Registry
      - name: Login to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} \
            --username ${{ secrets.ACR_USERNAME }} \
            --password-stdin

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/userservice-api:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/userservice-api:latest \
            -f Services/UserService/UserService.API/Dockerfile .

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/userservice-api:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/userservice-api:latest

      # Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name userserviceapi \
            --resource-group az-db-course \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/userservice-api:${{ github.sha }}
